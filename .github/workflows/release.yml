name: Build and Release Signed APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.1.0, etc.
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          # Nécessaire à « Determine Build Mode » : sans cela, le checkout du
          # run de main ne rapatrie aucun tag et ne peut pas détecter qu'un run
          # de tag traite déjà ce commit.
          #
          # Restreint à main : sur un run de tag, actions/checkout rapatrie déjà
          # la ref sous `+<sha>:refs/tags/<tag>`, et fetch-tags ajoute un second
          # refspec visant cette même ref — le fetch échoue alors sur
          # « Cannot fetch both <sha> and refs/tags/<tag> to refs/tags/<tag> ».
          # La détection n'a de toute façon de sens que sur main : un run de tag
          # compile toujours et ne consulte jamais les tags.
          fetch-tags: ${{ github.ref == 'refs/heads/main' }}

      # Deux scénarios de push mènent ici, et un seul build doit compiler :
      #  - main puis tag séparément : le run de main compile et amorce le cache
      #    Gradle, le run du tag le réutilise (~30 s).
      #  - main et tag poussés ensemble : deux runs démarrent en parallèle sur
      #    le même commit. Le run de main est alors inutile — il ne peut pas
      #    amorcer le cache à temps pour le run du tag, qui est déjà lancé — et
      #    ne ferait que compiler une seconde fois le même code. On le neutralise.
      - name: Determine Build Mode
        id: build_ctx
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build de tag : compilation et publication de la release."
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Ni main ni tag : aucun build."
          elif git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Ce commit porte déjà un tag de release : le run du tag compile, celui-ci s'efface."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Build de main : amorçage du cache Gradle pour le prochain tag."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Seul le run de main qui compile réellement a le droit d'écrire le
          # cache. Un run qui ne compile rien y réécrirait un cache vide — c'est
          # exactement ce qui produisait les 85 Ko que chaque tag restaurait
          # avant ce correctif. Un run de tag, lui, écrirait sous un scope
          # refs/tags/* qu'aucun autre run ne peut relire : quota gaspillé.
          cache-read-only: ${{ !(github.ref == 'refs/heads/main' && steps.build_ctx.outputs.should_build == 'true') }}

      # Le runner ubuntu-latest offre 4 vCPU / 16 Go : on relève le heap bien
      # au-delà des 3 Go du gradle.properties du projet, car R8 tourne dans le
      # process Gradle et passait l'essentiel de son temps en GC. Écrit dans
      # GRADLE_USER_HOME, qui a priorité sur le gradle.properties du dépôt :
      # les machines de dev ne sont pas impactées.
      - name: Tune Gradle for CI
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx3g
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Validate Release Version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail

          expected_version="${GITHUB_REF_NAME#v}"
          if [[ ! "$expected_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          actual_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          actual_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9_]+).*/\1/p' app/build.gradle.kts | head -n 1 | tr -d '_')"
          expected_code="$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"

          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $actual_version."
            exit 1
          fi

          if [[ "$actual_code" != "$expected_code" ]]; then
            echo "::error::versionCode $actual_code does not match expected value $expected_code."
            exit 1
          fi

      # Également exécuté sur main : le build de main sert à amorcer le cache
      # Gradle (voir « Build Release APK »), et validateSigningRelease échoue
      # sans keystore.
      - name: Decode Keystore File
        if: steps.build_ctx.outputs.should_build == 'true'
        shell: python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          import os
          import base64
          
          encoded = os.environ.get('KEYSTORE_BASE64', '')
          if not encoded:
              print("Warning: KEYSTORE_BASE64 is empty, keystore file not created.")
              exit(0)
              
          if ',' in encoded:
              encoded = encoded.split(',')[-1]
              
          encoded = encoded.replace('\\n', '').replace('\n', '').replace('\r', '').replace(' ', '').replace('\t', '')
          
          try:
              # Try strict decoding first
              decoded_data = base64.b64decode(encoded, validate=True)
              with open('app/release-keystore.jks', 'wb') as f:
                  f.write(decoded_data)
              print("Keystore file successfully decoded and saved in strict mode.")
          except Exception as e:
              print(f"Strict mode decoding failed: {e}. Trying non-strict mode...")
              try:
                  decoded_data = base64.b64decode(encoded)
                  with open('app/release-keystore.jks', 'wb') as f:
                      f.write(decoded_data)
                  print("Keystore file successfully decoded and saved in non-strict mode.")
              except Exception as e2:
                  print(f"Error: Keystore base64 decoding failed completely in both strict and non-strict modes.")
                  print(f"Error details: {e2}")
                  exit(1)

      # Exécuté aussi sur main, et pas uniquement sur les tags : gradle/actions
      # n'écrit le cache Gradle que depuis la branche par défaut (les caches
      # créés sur un ref refs/tags/* ne sont pas lisibles par le tag suivant).
      # Tant que main ne compilait rien, chaque tag repartait d'un cache vide de
      # 85 Ko et retéléchargeait toutes les dépendances Maven (~2 min).
      - name: Build Release APK
        if: steps.build_ctx.outputs.should_build == 'true'
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Release APK as Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
