name: Build and Release Signed APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.1.0, etc.

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore File
        shell: python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          import os
          import base64
          
          encoded = os.environ.get('KEYSTORE_BASE64', '')
          if not encoded:
              print("Warning: KEYSTORE_BASE64 is empty, keystore file not created.")
              exit(0)
              
          if ',' in encoded:
              encoded = encoded.split(',')[-1]
              
          encoded = encoded.replace('\\n', '').replace('\n', '').replace('\r', '').replace(' ', '').replace('\t', '')
          
          try:
              # Try strict decoding first
              decoded_data = base64.b64decode(encoded, validate=True)
              with open('app/release-keystore.jks', 'wb') as f:
                  f.write(decoded_data)
              print("Keystore file successfully decoded and saved in strict mode.")
          except Exception as e:
              print(f"Strict mode decoding failed: {e}. Trying non-strict mode...")
              try:
                  decoded_data = base64.b64decode(encoded)
                  with open('app/release-keystore.jks', 'wb') as f:
                      f.write(decoded_data)
                  print("Keystore file successfully decoded and saved in non-strict mode.")
              except Exception as e2:
                  print(f"Error: Keystore base64 decoding failed completely in both strict and non-strict modes.")
                  print(f"Error details: {e2}")
                  exit(1)

      - name: Build Release APK
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3 to create/update GitHub release..."
            if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
              echo "Release already exists, uploading APK..."
              gh release upload "${{ github.ref_name }}" \
                "app/build/outputs/apk/release/app-release.apk" --clobber \
                && { echo "✅ APK uploaded successfully"; exit 0; }
            else
              gh release create "${{ github.ref_name }}" \
                --title "Release ${{ github.ref_name }}" \
                --generate-notes \
                "app/build/outputs/apk/release/app-release.apk" \
                && { echo "✅ Release created successfully"; exit 0; }
            fi
            [ $attempt -lt 3 ] && { echo "⚠️ Attempt $attempt failed, retrying in 30s..."; sleep 30; }
          done
          echo "❌ Failed to create/update release after 3 attempts"
          exit 1
