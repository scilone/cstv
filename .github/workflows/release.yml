name: Build and Release Signed APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.1.0, etc.
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only write to the cache on the main branch to establish a baseline
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore File
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          import os
          import base64
          
          encoded = os.environ.get('KEYSTORE_BASE64', '')
          if not encoded:
              print("Warning: KEYSTORE_BASE64 is empty, keystore file not created.")
              exit(0)
              
          if ',' in encoded:
              encoded = encoded.split(',')[-1]
              
          encoded = encoded.replace('\\n', '').replace('\n', '').replace('\r', '').replace(' ', '').replace('\t', '')
          
          try:
              # Try strict decoding first
              decoded_data = base64.b64decode(encoded, validate=True)
              with open('app/release-keystore.jks', 'wb') as f:
                  f.write(decoded_data)
              print("Keystore file successfully decoded and saved in strict mode.")
          except Exception as e:
              print(f"Strict mode decoding failed: {e}. Trying non-strict mode...")
              try:
                  decoded_data = base64.b64decode(encoded)
                  with open('app/release-keystore.jks', 'wb') as f:
                      f.write(decoded_data)
                  print("Keystore file successfully decoded and saved in non-strict mode.")
              except Exception as e2:
                  print(f"Error: Keystore base64 decoding failed completely in both strict and non-strict modes.")
                  print(f"Error details: {e2}")
                  exit(1)

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
