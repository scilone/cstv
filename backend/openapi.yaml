openapi: 3.1.0
info:
  title: CSTV Backend POC API
  version: 1.0.0
  description: Email OTP authentication and opaque per-profile synchronization for CSTV.
servers:
  - url: http://localhost:18080
tags:
  - name: Health
  - name: Auth
  - name: Account
  - name: Profiles
  - name: Objects
  - name: Sync
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      description: Runs a real query against PostgreSQL; 503 is also returned when the connection cannot be opened.
      responses:
        '200':
          description: API and PostgreSQL are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Request accepted, regardless of whether the account exists.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerification'
      responses:
        '200':
          description: OTP accepted and access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account and its profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profiles belonging to the authenticated account.
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Profiles]
      operationId: createProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    patch:
      tags: [Profiles]
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Profiles]
      operationId: deleteProfile
      description: Deletes a non-last profile and appends DELETE changes for all objects removed by the cascade.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Profile deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/profiles/{profileId}/objects:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Objects]
      operationId: listProfileObjects
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Namespace'
      responses:
        '200':
          description: Object metadata only; payloads are not loaded or returned.
          content:
            application/json:
              schema:
                type: object
                required: [objects]
                properties:
                  objects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObjectMetadata'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/profiles/{profileId}/objects/{namespace}/{objectKey}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Namespace'
      - $ref: '#/components/parameters/ObjectKey'
    get:
      tags: [Objects]
      operationId: getProfileObject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exact opaque bytes stored for this object.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/vnd.cstv.blob+gzip:
              schema:
                type: string
                contentEncoding: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    put:
      tags: [Objects]
      operationId: putProfileObject
      description: >-
        Stores the bytes as received, without any decompression or inspection. Re-sending identical
        content succeeds, returns the same ETag and still appends one UPSERT revision. `If-Match`
        is optional: without it the last committed write wins, with it the header must match the
        ETag currently stored, and `*` only matches an object that already exists.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Schema-Version
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/vnd.cstv.blob+gzip:
            schema:
              type: string
              contentEncoding: binary
      responses:
        '204':
          description: Object created or replaced and sync revision appended.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Objects]
      operationId: deleteProfileObject
      description: >-
        Idempotent without `If-Match`: deleting an absent object returns 204 and appends no
        revision. With `If-Match`, the precondition is evaluated first and fails with 412 when the
        object is absent or carries another ETag, so a stale client cannot believe it removed the
        version it still held.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Object is absent.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/sync/changes:
    get:
      tags: [Sync]
      operationId: getSyncChanges
      description: >-
        Returns the account journal with `revision > cursor`, ordered ascending. Appends are
        serialized per account, so revision order is also commit order and polling with
        `nextCursor` can neither skip nor duplicate a change.
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum is configured by SYNC_MAX_LIMIT (500 by default).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Ordered changes for the authenticated account, without payloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPage'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Namespace'
    ObjectKey:
      name: objectKey
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectKey'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: A quoted current ETag, a comma-separated ETag list, or `*`.
      schema:
        type: string
  headers:
    ETag:
      description: Strong SHA-256 based HTTP entity tag, including quotes.
      schema:
        type: string
        pattern: '^"[a-f0-9]{64}"$'
  responses:
    Error:
      description: Uniform API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DatabaseUnavailable:
      description: PostgreSQL is not reachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OtpRequest:
      type: object
      additionalProperties: true
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    OtpVerification:
      type: object
      additionalProperties: true
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: '^\d{6}$'
    AccessToken:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 60
    Account:
      type: object
      additionalProperties: false
      required: [id, email, enabled, activeUntil, profiles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        enabled:
          type: boolean
        activeUntil:
          type: string
          format: date-time
        profiles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Profile'
    Profile:
      type: object
      additionalProperties: false
      required: [id, name, avatarId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        avatarId:
          type: integer
          minimum: 0
          maximum: 10000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileCreate:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        avatarId:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
    ProfileUpdate:
      type: object
      additionalProperties: true
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        avatarId:
          type: integer
          minimum: 0
          maximum: 10000
    Namespace:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    ObjectKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    ObjectMetadata:
      type: object
      additionalProperties: false
      required: [namespace, key, etag, schemaVersion, compressedSize, updatedAt]
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        key:
          $ref: '#/components/schemas/ObjectKey'
        etag:
          type: string
          pattern: '^[a-f0-9]{64}$'
        schemaVersion:
          type: integer
          minimum: 1
        compressedSize:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    SyncChange:
      type: object
      additionalProperties: false
      required: [revision, profileId, namespace, key, operation, etag, changedAt]
      properties:
        revision:
          type: integer
          minimum: 1
        profileId:
          type: string
          format: uuid
        namespace:
          $ref: '#/components/schemas/Namespace'
        key:
          $ref: '#/components/schemas/ObjectKey'
        operation:
          type: string
          enum: [UPSERT, DELETE]
        etag:
          oneOf:
            - type: string
              pattern: '^[a-f0-9]{64}$'
            - type: 'null'
        changedAt:
          type: string
          format: date-time
    SyncPage:
      type: object
      additionalProperties: false
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        nextCursor:
          type: integer
          minimum: 0
        hasMore:
          type: boolean
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
