openapi: 3.1.0
info:
  title: CSTV Backend POC API
  version: 1.0.0
  description: Email OTP authentication and opaque per-profile namespace snapshots for CSTV.
servers:
  - url: https://cstv.alwaysdata.net
    description: Production (alwaysdata, TLS uniquement — HTTP redirige en 301)
  - url: http://localhost:18080
    description: Développement local (Docker Compose)
tags:
  - name: Health
  - name: Auth
  - name: Account
  - name: Profiles
  - name: Objects
  - name: IptvCredentials
paths:
  /health:
    get:
      tags: [Health]
      operationId: health
      description: Runs a real query against PostgreSQL; 503 is also returned when the connection cannot be opened.
      responses:
        '200':
          description: API and PostgreSQL are reachable.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
  /v1/auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Request accepted, regardless of whether the account exists.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerification'
      responses:
        '200':
          description: OTP accepted and access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          description: Too many verification attempts from this client IP within the sliding window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: OTP_VERIFY_RATE_LIMITED
                  message: Too many verification attempts. Try again later.
  /v1/me:
    get:
      tags: [Account]
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account and its profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /v1/account/iptv-credentials:
    get:
      tags: [IptvCredentials]
      operationId: getIptvCredentials
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: The account-scoped IPTV credentials. Never cache this response.
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IptvCredentialsResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    put:
      tags: [IptvCredentials]
      operationId: putIptvCredentials
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IptvCredentialsRequest'}
      responses:
        '204': {description: Credentials encrypted and stored, headers: {ETag: {$ref: '#/components/headers/ETag'}, Cache-Control: {$ref: '#/components/headers/NoStore'}}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
    delete:
      tags: [IptvCredentials]
      operationId: deleteIptvCredentials
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '204': {description: Credentials deleted or already absent.}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '412': {$ref: '#/components/responses/Error'}
  /v1/profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profiles belonging to the authenticated account.
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Profiles]
      operationId: createProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileCreate'
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    patch:
      tags: [Profiles]
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Profile updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Profiles]
      operationId: deleteProfile
      description: Deletes a non-last profile; its namespace snapshots are removed by PostgreSQL cascade.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Profile deleted.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/profiles/{profileId}/objects:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Objects]
      operationId: listProfileObjects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: One metadata entry per namespace; payloads are not loaded or returned.
          content:
            application/json:
              schema:
                type: object
                required: [objects]
                properties:
                  objects:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObjectMetadata'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/profiles/{profileId}/objects/{namespace}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
      - $ref: '#/components/parameters/Namespace'
    get:
      tags: [Objects]
      operationId: getProfileObject
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exact opaque bytes stored for this namespace snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/vnd.cstv.blob+gzip:
              schema:
                type: string
                contentEncoding: binary
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
    put:
      tags: [Objects]
      operationId: putProfileObject
      description: >-
        Stores the namespace snapshot bytes as received, without decompression or inspection.
        A missing snapshot may be created without `If-Match`. Replacing an existing snapshot
        requires its current ETag; omission returns 428 and a stale value returns 412. `*` only
        matches an existing snapshot. Re-sending identical bytes returns the same ETag.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Schema-Version
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/vnd.cstv.blob+gzip:
            schema:
              type: string
              contentEncoding: binary
      responses:
        '204':
          description: Namespace snapshot created or replaced.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Objects]
      operationId: deleteProfileObject
      description: >-
        Deleting an existing namespace snapshot requires its current ETag; omission returns 428
        and a stale value returns 412. Deleting an already absent snapshot without `If-Match` is
        idempotent and returns 204. `If-Match` against an absent snapshot returns 412.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Object is absent.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '412':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Namespace:
      name: namespace
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Namespace'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: A quoted current ETag, a comma-separated ETag list, or `*`.
      schema:
        type: string
  headers:
    ETag:
      description: Strong SHA-256 based HTTP entity tag, including quotes.
      schema:
        type: string
        pattern: '^"[a-f0-9]{64}"$'
    NoStore:
      description: Sensitive credentials response; it must not be cached.
      schema:
        type: string
        const: no-store
  responses:
    Error:
      description: Uniform API error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DatabaseUnavailable:
      description: PostgreSQL is not reachable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OtpRequest:
      type: object
      additionalProperties: true
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
    OtpVerification:
      type: object
      additionalProperties: true
      required: [email, code]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        code:
          type: string
          pattern: '^\d{6}$'
    AccessToken:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: Nombre de secondes restant jusqu'à activeUntil du compte.
    Account:
      type: object
      additionalProperties: false
      required: [id, email, enabled, activeUntil, profiles]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        enabled:
          type: boolean
        activeUntil:
          type: string
          format: date-time
        profiles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Profile'
    Profile:
      type: object
      additionalProperties: false
      required: [id, name, avatarId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        avatarId:
          type: integer
          minimum: 0
          maximum: 10000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProfileCreate:
      type: object
      additionalProperties: true
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        avatarId:
          type: integer
          minimum: 0
          maximum: 10000
          default: 0
    ProfileUpdate:
      type: object
      additionalProperties: true
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        avatarId:
          type: integer
          minimum: 0
          maximum: 10000
    Namespace:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
    ObjectMetadata:
      type: object
      additionalProperties: false
      required: [namespace, etag, schemaVersion, compressedSize, updatedAt]
      properties:
        namespace:
          $ref: '#/components/schemas/Namespace'
        etag:
          type: string
          pattern: '^[a-f0-9]{64}$'
        schemaVersion:
          type: integer
          minimum: 1
        compressedSize:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
    IptvCredentialsRequest:
      type: object
      additionalProperties: false
      required: [host, port, username, password]
      properties:
        host: {type: string, minLength: 1, maxLength: 255}
        port: {type: integer, minimum: 1, maximum: 65535}
        username: {type: string, minLength: 1, maxLength: 128}
        password: {type: string, minLength: 1, maxLength: 256}
    IptvCredentialsResponse:
      allOf:
        - $ref: '#/components/schemas/IptvCredentialsRequest'
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: {type: string, format: date-time}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
